services:
  judoo-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-development}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_HUB_URL: ${VITE_HUB_URL:-}
    container_name: ${COMPOSE_PROJECT_NAME:-judoo}-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - judoo-network

  # Opcional: Ambiente de desenvolvimento com Hot-Reload (Vite)
  # Para rodar: docker compose --profile dev up
  judoo-web-dev:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-judoo}-web-dev
    working_dir: /app
    profiles:
      - dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - judoo-network

networks:
  judoo-network:
    name: judoo-network
    driver: bridge
